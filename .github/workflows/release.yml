name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (only when this run is on a v* tag)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install fonttools
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v${tag} does not match package.json version ${version}"
            exit 1
          fi
      - name: Package
        run: npm run dist
      - name: Check artifacts
        run: |
          version="$(node -p "require('./package.json').version")"
          dmg="release/Font-Buttler-${version}-arm64.dmg"
          zip="release/Font-Buttler-${version}-arm64.zip"
          blockmap="${zip}.blockmap"
          feed="release/latest-mac.yml"
          for file in "$dmg" "$zip" "$blockmap" "$feed"; do
            if [ ! -f "$file" ]; then
              echo "Missing ${file}"
              ls -la release || true
              exit 1
            fi
          done
          ls -lh "$dmg" "$zip" "$blockmap" "$feed"
      - name: Publish GitHub Release
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/Font-Buttler-*-arm64.dmg
            release/Font-Buttler-*-arm64.zip
            release/Font-Buttler-*-arm64.zip.blockmap
            release/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
